name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run build
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: grokbot-personal-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  agent-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grokbot
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: grokbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grokbot -d grokbot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AGENT_ACCESS_TOKEN: test-token
      DATABASE_URL: postgresql+psycopg://grokbot:test-only-password@localhost:5432/grokbot_test
    defaults:
      run:
        working-directory: services/agent-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt httpx pytest
      - run: python -m pytest tests -q
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t grokbot-agent-api:ci services/agent-api
